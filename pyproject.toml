[project]
name = "foodops-ai"
version = "0.1.0"
description = "An intelligent agent for restaurant operations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
]

[project.optional-dependencies]
agent = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "data*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

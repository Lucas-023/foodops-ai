services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: foodops
      POSTGRES_PASSWORD: foodops
      POSTGRES_DB: foodops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodops"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://foodops:foodops@db:5432/foodops
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
